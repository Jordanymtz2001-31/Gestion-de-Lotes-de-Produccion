<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Editar Producto</h4>
        </div>
        <div class="card-body">
          @if (loading && !productoDto.nombre) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>
          }
          @if (!loading || productoDto.nombre) {
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="codigo" class="form-label">Código *</label>
              <input
                type="text"
                class="form-control"
                id="codigo"
                [(ngModel)]="productoDto.codigo"
                name="codigo"
                required
                maxlength="12"
              />
            </div>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre *</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                [(ngModel)]="productoDto.nombre"
                name="nombre"
                required
                maxlength="50"
              />
            </div>

            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea
                class="form-control"
                id="descripcion"
                [(ngModel)]="productoDto.descripcion"
                name="descripcion"
                rows="3"
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="unidad_medida" class="form-label">Unidad de Medida *</label>
              <select
                class="form-select"
                id="unidad_medida"
                [(ngModel)]="productoDto.unidad_medida"
                name="unidad_medida"
                required>
                @for (u of unidades; track u.value) {
                <option [value]="u.value">
                  {{ u.label }}
                </option>
                }
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Stock Actual</label>
              <input
                type="text"
                class="form-control"
                [value]="stockActual"
                disabled
              />
              <small class="text-muted">El stock se modifica al aprobar lotes</small>
            </div>
            @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
            }
            <div class="d-flex justify-content-between">
              <a routerLink="/listar-productos" class="btn btn-secondary">
                Cancelar
              </a>
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading"
              >
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Actualizando...' : 'Actualizar' }}
              }
              </button>
            </div>
          </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
