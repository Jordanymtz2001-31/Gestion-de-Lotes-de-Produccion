<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Nuevo Lote</h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="codigo_lote" class="form-label">Código de Lote *</label>
              <input
                type="text"
                class="form-control"
                id="codigo_lote"
                [(ngModel)]="lote.codigo_lote"
                name="codigo_lote"
                required
                maxlength="25"
                placeholder="Ej: LOTE-2026-001"
              />
            </div>

            <div class="mb-3">
              <label for="producto" class="form-label">Producto *</label>
              <select
                class="form-select"
                id="producto"
                [(ngModel)]="lote.producto_id"
                name="producto_id"
                required
              >
                <option [value]="0" disabled>Seleccionar producto</option>
                @if (productos.length == 0 ) {
                <option [value]="0" disabled>No hay productos disponibles</option>
                }
                @else {
                  @for (p of productos; track p.id) {
                  <option [value]="p.id">
                    {{ p.nombre }} ({{ p.codigo }})
                  </option>
                  }
                }
              </select>
            </div>

            <div class="mb-3">
              <label for="proveedor" class="form-label">Proveedor *</label>
              <select
                class="form-select"
                id="proveedor"
                [(ngModel)]="lote.proveedor_id"
                name="proveedor_id"
                required
              >
                <option [value]="0" disabled>Seleccionar proveedor</option>
                @if (proveedores.length == 0) {
                <option [value]="0" disabled>No hay proveedores disponibles</option>
                }
                @else{
                  @for (pr of proveedores; track pr.id) {
                  <option [value]="pr.id">
                    {{ pr.nombre }}
                  </option>
                }
                }
              </select>
            </div>

            <div class="mb-3">
              <label for="cantidad" class="form-label">Cantidad Inicial *</label>
              <input
                type="number"
                class="form-control"
                id="cantidad"
                [(ngModel)]="lote.cantidad_inicial"
                name="cantidad_inicial"
                required
                min="1"
                placeholder="Cantidad de unidades"
              />
            </div>

            <div class="mb-3">
              <label for="fecha_produccion" class="form-label">Fecha de Producción *</label>
              <input
                type="date"
                class="form-control"
                id="fecha_produccion"
                [(ngModel)]="lote.fecha_produccion"
                name="fecha_produccion"
                required
              />
            </div>

            <div class="mb-3">
              <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                El lote se creará en estado <strong>REVISION</strong> y deberá ser aprobado por un supervisor.
              </div>
            </div>
            @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
            }
            @if (success) {
            <div class="alert alert-success">{{ success }}</div>
            }
            <div class="d-flex justify-content-between">
              <a routerLink="/listar-lotes" class="btn btn-secondary">
                Cancelar
              </a>
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="loading"
              >
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
                {{ loading ? 'Guardando...' : 'Guardar' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
