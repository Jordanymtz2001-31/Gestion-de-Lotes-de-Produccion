<!-- Layout principal de la aplicación -->
<div class="app-container">
  <!-- Navbar solo visible cuando está logueado -->
  @if (authService.estadoLogueado) {
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/dashboard">Textiles La Poblana</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/listar-lotes" routerLinkActive="active">Lotes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/listar-productos" routerLinkActive="active">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/listar-proveedores" routerLinkActive="active">Proveedores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/listar-movimientos" routerLinkActive="active">Movimientos</a>
          </li>
          <li class="nav-item">
            <!-- SI EL ROL DEL USUARIO ACTUAL ES ADMIN MOSTRAMOS EL ENLACE DE USUARIOS -->
            @if (authService.rol === 'ADMIN') {
              <a class="nav-link" routerLink="/listar-usuarios" routerLinkActive="active">Usuarios</a>
            }
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <span class="text-light me-3">{{ authService.usuarioActual()?.username }}</span>
          <button class="btn btn-outline-light btn-sm" (click)="logout()">Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </nav>
  }

  <!-- Contenido principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
